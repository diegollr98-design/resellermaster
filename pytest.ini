[pytest]
# `pythonpath = .` no es cosmetica: sin esto, `pytest` a secas NO encuentra el
# paquete `core` y la suite entera muere con 20 errores de coleccion.
#
# Localmente no se veia porque aqui siempre se ha corrido `python -m pytest`,
# que mete el directorio actual en sys.path por su cuenta. El ejecutable
# `pytest` no lo hace. O sea: la suite pasaba para quien la escribio y estaba
# rota para cualquiera que clonase y escribiese lo que el README dice.
# Lo cazo el CI en su primer push, no la suite ni el arranque local.
pythonpath = .
testpaths = tests
